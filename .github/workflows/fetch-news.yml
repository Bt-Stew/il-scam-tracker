name: Fetch Central Illinois Scam News

on:
  schedule:
    # Runs once a day, all sources together (GNews, NewsAPI.ai, FBI, SerpApi):
    #   14:00 UTC = 9:00am Central (CDT)
    #   Changed 2026-08-01: cut from twice daily (9am/9pm Central) to once
    #   daily (9am only), by request — the BBB report pull is the priority
    #   pull and stays twice daily; this news/AI-Overview pull only needs
    #   once. The digest scheduled task still runs at 9:05am AND 9:05pm
    #   Central (5 min after each BBB pull); the 9:05pm run picks up
    #   whatever news.json/ai_overview.json this morning's pull produced
    #   (same as before, just now the "before" is the only pull of the day
    #   instead of one of two).
    - cron: '0 14 * * *'
  workflow_dispatch: {}

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Query GNews for each city/county + Central Illinois
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: |
          set -e
          FROM=$(date -u -d '-36 hours' +'%Y-%m-%dT%H:%M:%SZ')
          QUERIES=(
            "Peoria, IL"
            "Springfield, IL"
            "Champaign, IL"
            "Urbana, IL"
            "Bloomington, IL"
            "Normal, IL"
            "Decatur, IL"
            "Pekin, IL"
            "Galesburg, IL"
            "Danville, IL"
            "LaSalle, IL"
            "Peru, IL"
            "Aurora, IL"
            "Joliet, IL"
            "Central Illinois"
            # Counties (catch smaller towns that never make the city list above,
            # e.g. a scam reported out of Morton or Chillicothe rarely names the
            # town but usually names "Tazewell County" or "Peoria County")
            "Sangamon County, IL"
            "McLean County, IL"
            "Macon County, IL"
            "Tazewell County, IL"
            "Knox County, IL"
            "Vermilion County, IL"
            "Kane County, IL"
            "Will County, IL"
          )
          mkdir -p gnews_results
          i=0
          for LOC in "${QUERIES[@]}"; do
            i=$((i+1))
            Q="scam AND \"$LOC\""
            ENC_Q=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$Q")
            curl -s --connect-timeout 10 --max-time 25 --retry 2 --retry-delay 3 --retry-connrefused \
              "https://gnews.io/api/v4/search?q=${ENC_Q}&lang=en&country=us&sortby=publishedAt&from=${FROM}&max=10&token=${GNEWS_API_KEY}" \
              | jq '[.articles[]? | {headline: .title, source: .source.name, publishedAt: .publishedAt, url: .url, summary: .description}]' \
              > "gnews_results/${i}.json" || echo "[]" > "gnews_results/${i}.json"
            sleep 1
          done
          echo "GNews: $(jq -s 'add | length' gnews_results/*.json) raw article(s) across all queries"

      - name: Query NewsAPI.ai (Event Registry) for each city/county + Central Illinois
        env:
          NEWSAPI_AI_KEY: ${{ secrets.NEWSAPI_AI_KEY }}
        run: |
          set -e
          FROM_DATE=$(date -u -d '-2 days' +'%Y-%m-%d')
          QUERIES=(
            "Peoria"
            "Springfield"
            "Champaign"
            "Urbana"
            "Bloomington"
            "Normal"
            "Decatur"
            "Pekin"
            "Galesburg"
            "Danville"
            "LaSalle"
            "Peru"
            "Aurora"
            "Joliet"
            "Central Illinois"
            # Counties, to sweep in smaller towns the city list above misses
            "Sangamon County"
            "McLean County"
            "Macon County"
            "Tazewell County"
            "Knox County"
            "Vermilion County"
            "Kane County"
            "Will County"
          )
          mkdir -p newsapi_results
          i=0
          for LOC in "${QUERIES[@]}"; do
            i=$((i+1))
            RESP=$(curl -s -G --connect-timeout 10 --max-time 25 --retry 2 --retry-delay 3 --retry-connrefused \
              "https://eventregistry.org/api/v1/article/getArticles" \
              --data-urlencode "keyword=scam" \
              --data-urlencode "keyword=${LOC}" \
              --data-urlencode "keywordOper=and" \
              --data-urlencode "lang=eng" \
              --data-urlencode "dateStart=${FROM_DATE}" \
              --data-urlencode "articlesSortBy=date" \
              --data-urlencode "articlesSortByAsc=false" \
              --data-urlencode "articlesCount=10" \
              --data-urlencode "resultType=articles" \
              --data-urlencode "apiKey=${NEWSAPI_AI_KEY}") || RESP='{"articles":{"results":[]}}'
            echo "$RESP" | jq '[.articles.results[]? | {
                headline: .title,
                source: (.source.title // "NewsAPI.ai"),
                publishedAt: (.dateTimePub // ((.date // "") + "T" + (.time // "00:00:00") + "Z")),
                url: .url,
                summary: (.body // "")[0:300]
              }]' > "newsapi_results/${i}.json" 2>/dev/null || echo "[]" > "newsapi_results/${i}.json"
            # jq emits `null` (not valid JSON array) on malformed/error responses; guard against that
            jq -e 'type == "array"' "newsapi_results/${i}.json" >/dev/null 2>&1 || echo "[]" > "newsapi_results/${i}.json"
            sleep 1
          done
          echo "NewsAPI.ai: $(jq -s 'add | length' newsapi_results/*.json) raw article(s) across all queries"
          echo "NOTE: if this is 0 across the board, check one raw response manually, Event Registry's exact parameter names were not fully verifiable from public docs at build time."

      - name: Query FBI Springfield press releases (scam-related, Central Illinois only)
        run: |
          set -e
          curl -sL --connect-timeout 10 --max-time 25 --retry 2 --retry-delay 3 --retry-connrefused \
            -A "Mozilla/5.0 (compatible; X1ScamTrackerBot/1.0; +https://bt-stew.github.io/il-scam-tracker/)" \
            "https://www.fbi.gov/contact-us/field-offices/springfield/news/RSS" \
            -o fbi_raw.xml || echo "<rss><channel></channel></rss>" > fbi_raw.xml

          python3 <<'PYEOF'
          import re
          import json
          import xml.etree.ElementTree as ET

          # Only these two conditions together count as a match: real scam/fraud
          # language AND an explicit Central Illinois city/county name that's
          # actually paired with "IL"/"Illinois" in the text. FBI Springfield's
          # jurisdiction runs from the Quad Cities down to Carbondale and
          # publishes every crime category, not just scams, so both filters
          # are required.
          SCAM_KEYWORDS = [
              "scam", "fraud", "phish", "swindle", "impersonat", "extortion",
              "identity theft", "wire fraud", "con artist", "embezzl", "ponzi",
              "romance scam", "elder fraud",
          ]
          CITIES = [
              "Peoria", "Springfield", "Champaign", "Urbana", "Bloomington",
              "Normal", "Decatur", "Pekin", "Galesburg", "Danville",
              "LaSalle", "Peru", "Aurora", "Joliet",
          ]
          # Counties, added so county-only mentions (e.g. "Sangamon County
          # Sheriff warns of...") that never name one of the cities above still
          # match. Peoria, Champaign, and LaSalle counties are already covered
          # via the bare city names in CITIES, so they're not repeated here.
          COUNTIES = [
              "Sangamon", "McLean", "Macon", "Tazewell",
              "Knox", "Vermilion", "Kane", "Will",
          ]
          PLACES = CITIES + COUNTIES

          def matches_scam(text):
              t = text.lower()
              return any(k in t for k in SCAM_KEYWORDS)

          def matches_city(text):
              # "Central Illinois" already contains "Illinois", so it self-qualifies.
              if re.search(r'\bCentral\s+Illinois\b', text):
                  return True
              # Every other place name must be paired with an explicit
              # IL/Illinois mention somewhere in the same text. Bare city/county
              # names are frequently ambiguous with places in other states
              # (Springfield, MA; Peoria, AZ; Aurora, CO; Danville, VA;
              # Decatur, GA; Bloomington, IN/MN) — this cost us a real false
              # positive (a Springfield, MA bitcoin-scam story) on 2026-08-01.
              if not (re.search(r'\bIL\b', text) or re.search(r'\bIllinois\b', text)):
                  return False
              return any(re.search(r'\b' + re.escape(p) + r'\b', text) for p in PLACES)

          try:
              tree = ET.parse('fbi_raw.xml')
              items = tree.getroot().findall('.//item')
          except ET.ParseError:
              items = []

          results = []
          for item in items:
              title = (item.findtext('title') or '').strip()
              link = (item.findtext('link') or '').strip()
              pubdate = (item.findtext('pubDate') or '').strip()
              desc = (item.findtext('description') or '').strip()
              combined = f"{title} {desc}"
              if matches_scam(combined) and matches_city(combined):
                  results.append({
                      "headline": title,
                      "source": "FBI Springfield Field Office",
                      "publishedAt": pubdate,
                      "url": link,
                      "summary": re.sub('<[^<]+?>', '', desc)[:300],
                  })

          with open('fbi.json', 'w') as f:
              json.dump(results, f, indent=2)

          print(f"FBI Springfield: {len(results)} scam-related Central Illinois release(s) out of {len(items)} total items checked")
          PYEOF

      - name: Merge sources and normalize dates
        run: |
          set -e
          jq -s 'add' gnews_results/*.json newsapi_results/*.json fbi.json > all_raw.json
          python3 <<'PYEOF'
          import json
          import re
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime

          with open('all_raw.json') as f:
              items = json.load(f)

          # Hard safety net applied to EVERY source, not just FBI: a provider's own
          # query filtering can silently fail (seen with NewsAPI.ai returning
          # globally irrelevant results despite a location keyword being sent), so
          # nothing reaches news.json unless it independently passes both checks here.
          # This must stay in sync with the CITIES/COUNTIES/matches_city() logic in
          # the FBI step above — this is the filter that actually decides what
          # survives into news.json, regardless of which source an article came from.
          SCAM_KEYWORDS = [
              "scam", "fraud", "phish", "swindle", "impersonat", "extortion",
              "identity theft", "wire fraud", "con artist", "embezzl", "ponzi",
              "romance scam", "elder fraud",
          ]
          CITIES = [
              "Peoria", "Springfield", "Champaign", "Urbana", "Bloomington",
              "Normal", "Decatur", "Pekin", "Galesburg", "Danville",
              "LaSalle", "Peru", "Aurora", "Joliet",
          ]
          # Counties, so a county-only mention (no city named) isn't dropped here
          # even if it made it past the per-source query/filter above. Peoria,
          # Champaign, and LaSalle counties are already covered via CITIES.
          COUNTIES = [
              "Sangamon", "McLean", "Macon", "Tazewell",
              "Knox", "Vermilion", "Kane", "Will",
          ]
          PLACES = CITIES + COUNTIES

          def matches_scam(text):
              t = text.lower()
              return any(k in t for k in SCAM_KEYWORDS)

          def matches_city(text):
              # "Central Illinois" already contains "Illinois", so it self-qualifies.
              if re.search(r'\bCentral\s+Illinois\b', text):
                  return True
              # Every other place name must be paired with an explicit
              # IL/Illinois mention somewhere in the same text — see the FBI
              # step above for why (Springfield, MA false positive, 2026-08-01).
              if not (re.search(r'\bIL\b', text) or re.search(r'\bIllinois\b', text)):
                  return False
              return any(re.search(r'\b' + re.escape(p) + r'\b', text) for p in PLACES)

          def normalize_date(raw):
              if not raw:
                  return None
              try:
                  # GNews format: 2026-07-31T09:15:00Z
                  return datetime.fromisoformat(raw.replace('Z', '+00:00')).isoformat()
              except ValueError:
                  pass
              try:
                  # RSS pubDate format: Fri, 31 Jul 2026 09:15:00 GMT
                  return parsedate_to_datetime(raw).astimezone(timezone.utc).isoformat()
              except (ValueError, TypeError):
                  return raw

          seen = set()
          deduped = []
          dropped_irrelevant = 0
          for it in items:
              url = it.get('url')
              if not url or url in seen:
                  continue
              combined = f"{it.get('headline','')} {it.get('summary','')}"
              if not (matches_scam(combined) and matches_city(combined)):
                  dropped_irrelevant += 1
                  continue
              seen.add(url)
              it['publishedAt'] = normalize_date(it.get('publishedAt'))
              deduped.append(it)

          deduped.sort(key=lambda x: x.get('publishedAt') or '', reverse=True)

          with open('news.json', 'w') as f:
              json.dump(deduped, f, indent=2)

          print(f"Merged: {len(deduped)} unique relevant item(s) total, {dropped_irrelevant} dropped as irrelevant")
          PYEOF
          rm -rf gnews_results newsapi_results fbi.json fbi_raw.xml all_raw.json

      - name: Query SerpApi for Central Illinois Scams AI Overview
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          set -e
          python3 <<'PYEOF'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          import urllib.error

          API_KEY = os.environ['SERPAPI_KEY']
          QUERY = "Central Illinois Scams"

          def fetch(params, timeout=25):
              url = "https://serpapi.com/search.json?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={"User-Agent": "X1ScamTracker/1.0"})
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  return json.loads(resp.read().decode())

          result = {"generated": False, "query": QUERY, "text_blocks": [], "references": []}

          try:
              data = fetch({"engine": "google", "q": QUERY, "hl": "en", "gl": "us", "api_key": API_KEY})
              if data.get("error"):
                  print(f"SerpApi returned an error on initial search: {data['error']}")
              ai = data.get("ai_overview", {}) or {}

              # Google doesn't always inline the full AI Overview in the first
              # response. If not, SerpApi hands back a page_token (valid ~1 min)
              # that must be exchanged immediately via the dedicated
              # google_ai_overview engine to get the actual text_blocks/references.
              if not ai.get("text_blocks") and ai.get("page_token"):
                  time.sleep(1)
                  try:
                      data2 = fetch({"engine": "google_ai_overview", "page_token": ai["page_token"], "api_key": API_KEY})
                      if data2.get("error"):
                          print(f"SerpApi returned an error on page_token follow-up: {data2['error']}")
                      ai = data2.get("ai_overview", ai) or ai
                  except (urllib.error.URLError, TimeoutError) as e:
                      print(f"SerpApi page_token follow-up request failed: {e}")

              text_blocks = ai.get("text_blocks") or []
              references = ai.get("references") or []

              if text_blocks:
                  result["generated"] = True
                  result["text_blocks"] = text_blocks
                  result["references"] = references
              else:
                  print("No AI Overview text_blocks were returned for this query today; leaving ai_overview.json empty/unset so the dashboard falls back gracefully.")
          except Exception as e:
              print(f"SerpApi AI Overview fetch failed: {e}")

          with open('ai_overview.json', 'w') as f:
              json.dump(result, f, indent=2)

          print(f"AI Overview: generated={result['generated']}, {len(result['text_blocks'])} block(s), {len(result['references'])} reference(s)")
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name "GNews Bot"
          git config user.email "actions@github.com"
          git add news.json ai_overview.json
          if git diff --cached --quiet; then
            echo "No changes to news.json or ai_overview.json"
          else
            git commit -m "Refresh local scam news + AI Overview (GNews + NewsAPI.ai + FBI Springfield + SerpApi): $(date -u +'%Y-%m-%d')"
            git push
          fi
