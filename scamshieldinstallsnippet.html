<!-- Swap data-tier to "local-scout", "local-guardian", or "local-sentinel" -->

<div id="bbb-scam-shield" data-tier="local-guardian"></div>
<script src="https://bt-stew.github.io/il-scam-tracker/scam-shield-badge.js" async></script>

<!-- Optional attributes on the div:
     data-theme="dark"            light (default) or dark
     data-date-format="short"     full (default) | short | month-year
     data-tooltip="false"         turn off the hover/focus info tooltip
     data-image="https://..."     override the badge image for just this instance
     data-label="..."             override the tier name text
     data-tagline="..."           override the small line under the tier name
     data-blurb="..."             override the tooltip description text
     data-url="https://..."       override the link target (default: https://bbbscamstop.com/central-illinois)

     The whole badge links out to https://bbbscamstop.com/central-illinois by default
     (opens in a new tab) — not a BBB business profile, not a third-party site.
-->
